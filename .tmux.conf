#### general ####
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded!"

# unbind default prefix and set it to ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# make delay shorter -- but not 0. Escape sequences that arrive split across reads
# (slow ssh, heavy load) can be misparsed at 0. 10ms is imperceptible and is what
# nvim's :checkhealth and the tmux FAQ ask for.
set -sg escape-time 10

# start with window number 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on window close
set -g renumber-windows on

set-option -g focus-events on

#### key bindings ####

# quickly open a new window in the current pane's directory
bind N new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# synchronize all panes in a window
bind y setw synchronize-panes

# Quick window selection
bind -r p previous-window
bind -r n next-window

# pane movement shortcuts (same as vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# C-l runs select-pane -R instead of reaching the app. This puts clear-screen back:
#   C-l        -> select-pane -R  (navigator)
#   prefix C-l -> clear screen
bind C-l send-keys 'C-l'

# enable mouse support for switching panes/windows
set -g mouse on

# Split windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

#### copy mode : vim ####

# set vi mode for copy mode
setw -g mode-keys vi

# copy mode using 'Esc'
unbind [
bind Escape copy-mode

#### terminal capabilities ####

set -g default-terminal "tmux-256color"
set -gu terminal-features
set -as terminal-features ",xterm-ghostty:RGB,xterm*:extkeys"

#### claude code ####

# Let apps send escape sequences straight through to Ghostty. Without this,
# tmux swallows Claude Code's desktop notifications and progress bar.
# 'all' rather than 'on': 'on' only passes sequences through for the VISIBLE pane,
# which is exactly the case where a background agent can't notify you.
set -g allow-passthrough all

# Report modified keys via modifyOtherKeys when an app asks for them.
# The matching xterm*:extkeys terminal-feature is set in the section above.
set -s extended-keys on

# Claude Code sessions produce a lot of output. Also needed for the
# fullscreen escape hatch: Ctrl+O then [ dumps the conversation into
# native scrollback so tmux copy mode can search it.
set-option -g history-limit 50000

#### tmux plugins ####

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Capture only the visible screen, instead of the "full" default.
set -g @resurrect-pane-contents-area 'visible'

set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @tokyo-night-tmux_theme storm    # storm | day | default to 'night'
set -g @tokyo-night-tmux_theme day    # storm | day | default to 'night'
set -g @tokyo-night-tmux_transparent 1  # 1 or 0

# Icon styles
set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 

# No extra spaces between icons
set -g @tokyo-night-tmux_window_tidy_icons 0
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_netspeed_iface "en0" # Detected via default route
set -g @tokyo-night-tmux_netspeed_showip 0      # Display IPv4 address (default 0)
set -g @tokyo-night-tmux_netspeed_refresh 1     # Update interval in seconds (default 1)
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_battery_low_threshold 21 # default

set -g status-position top

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
